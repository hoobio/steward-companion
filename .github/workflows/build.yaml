name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "tools/**", ".githooks/**", "scripts/Install-DevBuild.ps1"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "tools/**", ".githooks/**", "scripts/Install-DevBuild.ps1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ startsWith(github.event.head_commit.message, 'chore(main): release') && 'release' || 'build' }}"
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: "10.0.203"
  SOLUTION_PATH: Steward.slnx
  PROJECT_PATH: src/Steward.Desktop/Steward.Desktop.csproj
  WIX_SOURCE_PATH: installer/Steward.wxs
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  release-please:
    name: Release Please
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: rp
        uses: hoobio/pipeline-tools/pipeline/github/step/release-please@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: version
        if: steps.rp.outputs.release_created == 'true'
        shell: bash
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build
        if: runner.os == 'Windows'
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release

      - name: Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet test --project tests/Steward.Core.Tests/Steward.Core.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/Steward.Desktop.Tests/Steward.Desktop.Tests.csproj -c Release --no-build

      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb >/dev/null; }

      - name: Build and test
        if: runner.os == 'Linux'
        run: |
          dotnet build tests/Steward.Core.Tests/Steward.Core.Tests.csproj -c Release -f net10.0 -p:EnableWindowsTargeting=true
          dotnet build tests/Steward.Desktop.Tests/Steward.Desktop.Tests.csproj -c Release -f net10.0 -p:EnableWindowsTargeting=true
          dotnet test --project tests/Steward.Core.Tests/Steward.Core.Tests.csproj -c Release -f net10.0 --no-build -p:EnableWindowsTargeting=true
          xvfb-run -a -s "-screen 0 1920x1200x24" dotnet test --project tests/Steward.Desktop.Tests/Steward.Desktop.Tests.csproj -c Release -f net10.0 --no-build -p:EnableWindowsTargeting=true

  build-msi:
    name: Build MSI
    needs: [release-please]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' && vars.SIGNING_CERT_THUMBPRINT != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          "version=$((Get-Content version.txt -Raw).Trim())" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Publish unpackaged self-contained build
        shell: pwsh
        env:
          PUBLISH_DIR: ${{ github.workspace }}\publish\x64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null
          # NuGet's restore can fail with a bare MSB4181 and no cause (NuGet/Home#13460), so the publish gets three attempts.
          $attempt = 0
          do {
            $attempt++
            dotnet publish $env:PROJECT_PATH `
              -c Release `
              -f net10.0-windows10.0.26100.0 `
              -r win-x64 `
              --self-contained `
              -p:PublishSingleFile=false `
              -p:GitHubRelease=true `
              -p:Version=$env:VERSION `
              -o $env:PUBLISH_DIR
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "dotnet publish failed (exit $LASTEXITCODE), attempt $attempt of 3"
          } while ($attempt -lt 3)
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$env:PUBLISH_DIR\Steward.App.exe")) { throw "Expected Steward.App.exe in publish output" }

      - name: Build MSI
        uses: hoobio/pipeline-tools/pipeline/github/step/build-msi-wix@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          wix-source-path: ${{ env.WIX_SOURCE_PATH }}
          version: ${{ steps.version.outputs.version }}
          platform: x64
          payload-dir: ${{ github.workspace }}\publish\x64
          output-dir: ${{ github.workspace }}\staging\msi-x64
          extensions: WixToolset.UI.wixext/5.0.2,WixToolset.Util.wixext/5.0.2

      - name: Sign MSI
        if: env.HAS_SIGNING_CERT == 'true'
        uses: hoobio/pipeline-tools/pipeline/github/step/sign-msi@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          pfx-base64: ${{ secrets.SIGNING_CERTIFICATE }}
          pfx-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          thumbprint: ${{ vars.SIGNING_CERT_THUMBPRINT }}
          packages-path: ${{ github.workspace }}\staging\msi-x64

      - name: Skip-sign notice
        if: env.HAS_SIGNING_CERT != 'true'
        shell: bash
        run: echo "::warning::SIGNING_CERTIFICATE / SIGNING_CERT_THUMBPRINT not set; MSI produced unsigned."

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: msi-x64
          path: ${{ github.workspace }}\staging\msi-x64\Steward-${{ steps.version.outputs.version }}-x64.msi
          if-no-files-found: error

  build-msix:
    name: Build MSIX
    needs: [release-please]
    if: >-
      always()
      && needs.release-please.result != 'failure'
      && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-version: ${{ steps.version.outputs.release-version }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          $release = (Get-Content version.txt -Raw).Trim()
          "release-version=$release" | Out-File -Append $env:GITHUB_OUTPUT
          $majorMinor = $release -replace '^(\d+\.\d+)\.\d+$', '$1'
          $nextVersion = $release
          if ($env:RELEASE_CREATED -ne 'true') {
            $title = gh pr list --head release-please--branches--main --state open --json title --jq '.[0].title // empty'
            if ($title -match 'release (\d+\.\d+\.\d+)') {
              $nextVersion = $Matches[1]
              $majorMinor = $nextVersion -replace '^(\d+\.\d+)\.\d+$', '$1'
            }
          }
          "version=$majorMinor.$($env:GITHUB_RUN_NUMBER).0" | Out-File -Append $env:GITHUB_OUTPUT
          $displayVersion = if ($env:RELEASE_CREATED -eq 'true') { $release } else { "$nextVersion-pre.$($env:GITHUB_RUN_NUMBER)" }
          "display-version=$displayVersion" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Build MSIX and msixupload
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display-version }}
          PRE_RELEASE: ${{ needs.release-please.outputs.release_created != 'true' }}
          STAGE_DIR: ${{ github.workspace }}\staging\msix-x64
        run: |
          $ErrorActionPreference = 'Stop'
          $package = ./scripts/Build-DesktopMsix.ps1 -Identity Store -Version $env:VERSION -StoreDisplayVersion $env:DISPLAY_VERSION `
            -PreRelease:($env:PRE_RELEASE -eq 'true') -OutputDirectory "$env:RUNNER_TEMP\msix"
          $package | Format-List | Out-String | Write-Host
          New-Item -ItemType Directory -Path $env:STAGE_DIR -Force | Out-Null
          Copy-Item $package.Msix, $package.MsixUpload $env:STAGE_DIR
          Get-ChildItem $env:STAGE_DIR | Format-Table Name, Length | Out-String | Write-Host

      - name: Upload msixupload artifact
        uses: actions/upload-artifact@v7
        with:
          name: msixupload-x64
          path: ${{ github.workspace }}\staging\msix-x64\Steward-${{ steps.version.outputs.version }}-Store-x64.msixupload
          if-no-files-found: error

      - name: Upload msix artifact
        uses: actions/upload-artifact@v7
        with:
          name: msix-x64
          path: ${{ github.workspace }}\staging\msix-x64\Steward-${{ steps.version.outputs.version }}-x64.msix
          if-no-files-found: error

  desktop:
    name: Desktop builds
    needs: [release-please]
    if: always() && needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-builds.yaml
    with:
      version: ${{ needs.release-please.outputs.version }}
      display-version: ${{ needs.release-please.outputs.version }}
      preview: false
    secrets: inherit

  certify:
    name: Windows App Certification Kit
    needs: [build-msix]
    if: always() && needs.build-msix.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      result: ${{ steps.wack.outputs.result }}
      detail: ${{ steps.wack.outputs.detail }}
    steps:
      - uses: actions/checkout@v7

      - name: Download MSIX
        uses: actions/download-artifact@v8
        with:
          name: msix-x64
          path: package

      - name: Run the kit on the MSIX
        id: wack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path report -Force | Out-Null
          ./.github/scripts/Invoke-AppCert.ps1 -MsixPath (Get-ChildItem package\*.msix).FullName -ReportPath report\certification-report.html `
            -XmlPath report\appcert.xml -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - uses: actions/upload-artifact@v7
        with:
          name: certification-report
          path: report
          if-no-files-found: error

  virus-scan:
    name: Virus scan
    needs: [build-msix, build-msi, desktop]
    if: always() && needs.build-msix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.scan.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the Windows zip, Linux packages and dmgs
        if: needs.desktop.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: scan
          merge-multiple: true

      - name: Download MSIX
        uses: actions/download-artifact@v8
        with:
          name: msix-x64
          path: scan

      - name: Download msixupload
        uses: actions/download-artifact@v8
        with:
          name: msixupload-x64
          path: scan

      - name: Download MSI
        if: needs.build-msi.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: msi-x64
          path: scan

      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || { sleep 30; sudo freshclam; }

      - name: Scan packages
        id: scan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path report -Force | Out-Null
          ./.github/scripts/Invoke-VirusScan.ps1 -ScanDirectory scan -ReportPath report/virus-scan-report.html `
            -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: virus-scan-report
          path: report
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: [release-please, lint-and-test, build-msix, build-msi, desktop, virus-scan, certify]
    if: >-
      always()
      && needs.release-please.outputs.release_created == 'true'
      && needs.lint-and-test.result == 'success'
      && needs.desktop.result == 'success'
      && needs.virus-scan.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download MSIX
        if: needs.build-msix.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: msix-x64
          path: release

      - name: Attach MSIX to the draft release
        if: needs.build-msix.result == 'success'
        uses: hoobio/pipeline-tools/pipeline/github/step/upload-to-github-release@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          file-path: release/Steward-${{ needs.build-msix.outputs.version }}-x64.msix
          github-token: ${{ github.token }}

      - name: Download msixupload
        if: needs.build-msix.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: msixupload-x64
          path: release

      - name: Attach msixupload to the draft release
        if: needs.build-msix.result == 'success'
        uses: hoobio/pipeline-tools/pipeline/github/step/upload-to-github-release@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          file-path: release/Steward-${{ needs.build-msix.outputs.version }}-Store-x64.msixupload
          github-token: ${{ github.token }}

      - name: Download MSI
        if: needs.build-msi.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: msi-x64
          path: release

      # An immutable release accepts no asset once published, so the MSI joins the draft here rather than after the publish.
      - name: Attach MSI to the draft release
        if: needs.build-msi.result == 'success'
        uses: hoobio/pipeline-tools/pipeline/github/step/upload-to-github-release@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          file-path: release/Steward-${{ needs.build-msi.outputs.version }}-x64.msi
          github-token: ${{ github.token }}

      - name: Download the Windows zip, Linux packages and dmgs
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true

      - name: Attach the Windows zip, Linux packages and dmgs to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ls -l desktop
          gh release upload "$TAG" desktop/* --clobber

      - name: Download the reports
        uses: actions/download-artifact@v8
        with:
          pattern: "*-report"
          path: reports
          merge-multiple: true

      - name: Attach the reports to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          for report in reports/virus-scan-report.html reports/certification-report.html; do
            [ -f "$report" ] && gh release upload "$TAG" "$report" --clobber
          done
          true

      - name: Stack release notes back to the last minor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VIRUS_SCAN: ${{ needs.virus-scan.outputs.summary }}
          CERT_RESULT: ${{ needs.certify.outputs.result }}
          CERT_DETAIL: ${{ needs.certify.outputs.detail }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $notes = [System.Collections.Generic.List[string]]::new()
          $started = $false
          $stop = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[?(\d+)\.(\d+)\.(\d+)') {
              $lineVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
              if (-not $started) { $started = $lineVersion -eq $version }
              elseif ($stop) { break }
              if ($started -and $Matches[3] -eq '0') { $stop = $true }
            }
            if ($started) { $notes.Add($line) }
          }
          if ($notes.Count -eq 0) { throw "No CHANGELOG.md section for $version" }
          $header = ./.github/scripts/New-TrustHeader.ps1 -Tag $env:TAG -VirusScanSummary $env:VIRUS_SCAN -CertificationResult $env:CERT_RESULT -CertificationDetail $env:CERT_DETAIL
          $platforms = @(
            ''
            'macOS does not open the dmg until you remove the quarantine flag, because the build is not notarised. Drag Steward to Applications, then run `xattr -dr com.apple.quarantine /Applications/Steward.app` in Terminal. Alternatively, open Steward once, then go to System Settings > Privacy & Security and select Open Anyway.'
            ''
            'On Linux, install from the signed package feed so that `apt upgrade` or `dnf upgrade` gets the next release. The [README](https://github.com/hoobio/steward-companion/blob/main/README.md#linux) shows how to set it up.'
          )
          Set-Content -Path notes.md -Value (@($header) + $notes + $platforms)
          gh release edit $env:TAG --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed (exit $LASTEXITCODE)" }

      - name: Publish the release
        uses: hoobio/pipeline-tools/pipeline/github/step/publish-github-release@353f3a7d09d9e63ae303631a4a4bb1ac83f97635 # v2.4.0
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          github-token: ${{ github.token }}

  linux-feed:
    name: Linux package feed
    needs: [release-please, release]
    if: always() && needs.release.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/linux-feed.yaml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit

  store-submit:
    name: Publish to Microsoft Store
    needs: [release-please, lint-and-test, build-msix]
    if: >-
      always()
      && needs.release-please.outputs.release_created == 'true'
      && needs.lint-and-test.result == 'success'
      && needs.build-msix.result == 'success'
      && vars.AZURE_CLIENT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      STORE_PRODUCT_ID: 9PBKMZFKZHKX
      KEY_VAULT: hbicfgkvtaus01
    steps:
      - uses: actions/checkout@v7

      - name: Download msixupload
        uses: actions/download-artifact@v8
        with:
          name: msixupload-x64
          path: package

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Find previous published release
        id: previous-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-msix.outputs.release-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api repos/${{ github.repository }}/releases --paginate | ConvertFrom-Json
          $current = [version]$env:VERSION
          $best = $null
          foreach ($r in $releases) {
            if ($r.draft -or $r.prerelease) { continue }
            if ($r.tag_name -notmatch '^v?(\d+\.\d+\.\d+)$') { continue }
            $v = [version]$Matches[1]
            if ($v -ge $current) { continue }
            if (-not $best -or $v -gt $best) { $best = $v }
          }
          if ($best) { "since=$best" | Out-File -Append $env:GITHUB_OUTPUT }

      - name: Configure Store credentials from Key Vault
        shell: pwsh
        run: |
          $store = @{}
          foreach ($name in 'tenant-id', 'client-id', 'client-secret', 'seller-id') {
            $value = az keyvault secret show --vault-name $env:KEY_VAULT --name "msstore-$name" --query value -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $value) { throw "Key Vault secret msstore-$name could not be read" }
            Write-Host "::add-mask::$value"
            $store[$name] = $value
          }
          msstore reconfigure --tenantId $store['tenant-id'] --sellerId $store['seller-id'] --clientId $store['client-id'] --clientSecret $store['client-secret']
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }

      - name: Publish package + release notes to Store
        shell: pwsh
        env:
          PRODUCT_ID: ${{ env.STORE_PRODUCT_ID }}
          VERSION: ${{ needs.build-msix.outputs.release-version }}
          SINCE_VERSION: ${{ steps.previous-release.outputs.since }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\scripts\Get-StoreWhatsNew.ps1"
          . "$env:GITHUB_WORKSPACE\scripts\Wait-StoreSubmissionClear.ps1"
          $package = (Get-ChildItem package -Filter *.msixupload | Select-Object -First 1).FullName
          if (-not $package) { throw 'No .msixupload artifact found' }

          $attempt = 0
          do {
            $attempt++
            Wait-StoreSubmissionClear -ProductId $env:PRODUCT_ID
            $publishOut = msstore publish $package -id $env:PRODUCT_ID --noCommit 2>&1 | Out-String
            Write-Host $publishOut
            if ($LASTEXITCODE -eq 0) { break }
            if ($publishOut -notmatch 'Error while creating submission' -or $attempt -ge 3) {
              throw "msstore publish failed ($LASTEXITCODE)"
            }
            Write-Host "msstore publish failed creating the submission; retrying in 60 seconds (attempt $attempt of 3)."
            Start-Sleep -Seconds 60
          } while ($true)

          $whatsNewParams = @{ ChangelogPath = "$env:GITHUB_WORKSPACE\CHANGELOG.md"; Version = $env:VERSION }
          if ($env:SINCE_VERSION) { $whatsNewParams.SinceVersion = $env:SINCE_VERSION }
          $whatsNew = Get-StoreWhatsNew @whatsNewParams

          $sub = Get-StorePendingSubmission -ProductId $env:PRODUCT_ID -PackagePath $package
          Hide-StoreUploadUrl $sub

          foreach ($listing in $sub.Listings.PSObject.Properties) {
            $listing.Value.BaseListing | Add-Member -NotePropertyName ReleaseNotes -NotePropertyValue $whatsNew -Force
          }
          $delivery = $sub.PackageDeliveryOptions ?? [pscustomobject]@{}
          $delivery | Add-Member IsMandatoryUpdate $true -Force
          $delivery | Add-Member MandatoryUpdateEffectiveDate ([DateTime]::UtcNow.ToString('o')) -Force
          $sub | Add-Member PackageDeliveryOptions $delivery -Force

          $sub | ConvertTo-Json -Depth 100 | Set-Content -Path patched.json -Encoding utf8
          $null = msstore submission update $env:PRODUCT_ID (Get-Content -Raw patched.json) 2>&1
          if ($LASTEXITCODE -ne 0) { throw "submission update failed ($LASTEXITCODE)" }

          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "submission publish failed ($LASTEXITCODE)" }
          Write-Host "Submitted $package to the Store (product $env:PRODUCT_ID)."

  store-flight:
    name: Submit to Store pre-release flight
    needs: [release-please, build-msix]
    if: >-
      always()
      && needs.build-msix.result == 'success'
      && vars.STORE_FLIGHT_ID != ''
      && vars.AZURE_CLIENT_ID != ''
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      STORE_PRODUCT_ID: 9PBKMZFKZHKX
      KEY_VAULT: hbicfgkvtaus01
    steps:
      - uses: actions/checkout@v7

      - name: Download msixupload
        uses: actions/download-artifact@v8
        with:
          name: msixupload-x64
          path: package

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Store credentials from Key Vault
        shell: pwsh
        run: |
          $store = @{}
          foreach ($name in 'tenant-id', 'client-id', 'client-secret', 'seller-id') {
            $value = az keyvault secret show --vault-name $env:KEY_VAULT --name "msstore-$name" --query value -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $value) { throw "Key Vault secret msstore-$name could not be read" }
            Write-Host "::add-mask::$value"
            $store[$name] = $value
          }
          msstore reconfigure --tenantId $store['tenant-id'] --sellerId $store['seller-id'] --clientId $store['client-id'] --clientSecret $store['client-secret']
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }

      - name: Publish package to the Store flight
        shell: pwsh
        env:
          PRODUCT_ID: ${{ env.STORE_PRODUCT_ID }}
          FLIGHT_ID: ${{ vars.STORE_FLIGHT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\scripts\Wait-StoreSubmissionClear.ps1"
          $package = (Get-ChildItem package -Filter *.msixupload | Select-Object -First 1).FullName
          if (-not $package) { throw 'No .msixupload artifact found' }

          $attempt = 0
          do {
            $attempt++
            Wait-StoreSubmissionClear -ProductId $env:PRODUCT_ID -FlightId $env:FLIGHT_ID
            $publishOut = msstore publish $package -id $env:PRODUCT_ID --flightId $env:FLIGHT_ID --noCommit 2>&1 | Out-String
            Write-Host $publishOut
            if ($LASTEXITCODE -eq 0) { break }
            if ($publishOut -notmatch 'Error while creating flight submission' -or $attempt -ge 3) {
              throw "msstore publish failed ($LASTEXITCODE)"
            }
            Write-Host "msstore publish failed creating the flight submission; retrying in 60 seconds (attempt $attempt of 3)."
            Start-Sleep -Seconds 60
          } while ($true)

          $sub = Get-StorePendingSubmission -ProductId $env:PRODUCT_ID -PackagePath $package -FlightId $env:FLIGHT_ID
          Hide-StoreUploadUrl $sub
          $delivery = $sub.PackageDeliveryOptions ?? [pscustomobject]@{}
          $delivery | Add-Member IsMandatoryUpdate $true -Force
          $delivery | Add-Member MandatoryUpdateEffectiveDate ([DateTime]::UtcNow.ToString('o')) -Force
          $sub | Add-Member PackageDeliveryOptions $delivery -Force
          $sub | ConvertTo-Json -Depth 100 | Set-Content -Path patched.json -Encoding utf8
          $null = msstore flights submission update $env:PRODUCT_ID $env:FLIGHT_ID (Get-Content -Raw patched.json) 2>&1
          if ($LASTEXITCODE -ne 0) { throw "flights submission update failed ($LASTEXITCODE)" }

          msstore flights submission publish $env:PRODUCT_ID $env:FLIGHT_ID
          if ($LASTEXITCODE -ne 0) { throw "flights submission publish failed ($LASTEXITCODE)" }
          Write-Host "Submitted $package to Store flight $env:FLIGHT_ID (product $env:PRODUCT_ID)."
