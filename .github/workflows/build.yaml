name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "tools/**", ".githooks/**", "scripts/Install-DevBuild.ps1"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "tools/**", ".githooks/**", "scripts/Install-DevBuild.ps1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'chore(main): release') && 'release' || 'build' }}"
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: "10.0.203"
  SOLUTION_PATH: Steward.slnx
  PROJECT_PATH: src/Steward.App/Steward.App.csproj
  WIX_SOURCE_PATH: installer/Steward.wxs
  APPXMANIFEST_PATH: src/Steward.App/Package.appxmanifest

jobs:
  release-please:
    name: Release Please
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: hoobio/pipeline-tools/pipeline/github/step/release-please@v2.3.1
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  lint-and-test:
    name: Lint & Test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release

      - name: Test
        run: dotnet test --project tests/Steward.Core.Tests/Steward.Core.Tests.csproj -c Release

  build-msi:
    name: Build MSI
    needs: [release-please]
    if: always() && github.event_name != 'pull_request' && needs.release-please.result != 'failure'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msi_version: ${{ steps.version.outputs.msi_version }}
    permissions:
      contents: read
      pull-requests: read
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' && vars.SIGNING_CERT_THUMBPRINT != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          $msi = (Get-Content version.txt -Raw).Trim()
          if ($env:RELEASE_CREATED -ne 'true') {
            $title = gh pr list --head release-please--branches--main --state open --json title --jq '.[0].title // empty'
            if ($title -match 'release (\d+\.\d+\.\d+)') { $msi = $Matches[1] }
          }
          $ver = if ($env:RELEASE_CREATED -eq 'true') { $msi } else { "$msi-pre-release.$($env:GITHUB_RUN_NUMBER).$($env:GITHUB_SHA.Substring(0, 7))" }
          "msi_version=$msi" | Out-File -Append $env:GITHUB_OUTPUT
          "version=$ver" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Publish unpackaged self-contained build
        shell: pwsh
        env:
          PUBLISH_DIR: ${{ github.workspace }}\publish\x64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null
          # NuGet's restore can fail with a bare MSB4181 and no cause (NuGet/Home#13460), so the publish gets three attempts.
          $attempt = 0
          do {
            $attempt++
            dotnet publish $env:PROJECT_PATH `
              -c Release `
              -p:Platform=x64 `
              -p:RuntimeIdentifier=win-x64 `
              -p:WindowsPackageType=None `
              -p:WindowsAppSDKSelfContained=true `
              -p:SelfContained=true `
              -p:GitHubRelease=true `
              -p:Version=$env:VERSION `
              -o $env:PUBLISH_DIR
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "dotnet publish failed (exit $LASTEXITCODE), attempt $attempt of 3"
          } while ($attempt -lt 3)
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path "$env:PUBLISH_DIR\Steward.App.exe")) {
            throw "Expected Steward.App.exe in publish output"
          }

      - name: Build MSI
        uses: hoobio/pipeline-tools/pipeline/github/step/build-msi-wix@v2.3.1
        with:
          wix-source-path: ${{ env.WIX_SOURCE_PATH }}
          version: ${{ steps.version.outputs.msi_version }}
          platform: x64
          payload-dir: ${{ github.workspace }}\publish\x64
          output-dir: ${{ github.workspace }}\staging\msi-x64
          extensions: WixToolset.UI.wixext/5.0.2,WixToolset.Util.wixext/5.0.2

      - name: Sign MSI
        if: env.HAS_SIGNING_CERT == 'true'
        uses: hoobio/pipeline-tools/pipeline/github/step/sign-msi@v2.3.1
        with:
          pfx-base64: ${{ secrets.SIGNING_CERTIFICATE }}
          pfx-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          thumbprint: ${{ vars.SIGNING_CERT_THUMBPRINT }}
          packages-path: ${{ github.workspace }}\staging\msi-x64

      - name: Skip-sign notice
        if: env.HAS_SIGNING_CERT != 'true'
        shell: bash
        run: echo "::warning::SIGNING_CERTIFICATE / SIGNING_CERT_THUMBPRINT not set; MSI produced unsigned."

      - name: Rename MSI to the full version
        if: steps.version.outputs.version != steps.version.outputs.msi_version
        shell: pwsh
        working-directory: ${{ github.workspace }}\staging\msi-x64
        run: Rename-Item "Steward-${{ steps.version.outputs.msi_version }}-x64.msi" "Steward-${{ steps.version.outputs.version }}-x64.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: msi-x64
          path: ${{ github.workspace }}\staging\msi-x64\Steward-${{ steps.version.outputs.version }}-x64.msi
          if-no-files-found: error

  build-msix:
    name: Build MSIX
    needs: [release-please]
    if: always() && github.event_name == 'push' && needs.release-please.result != 'failure'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          "version=$ver" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Stamp Package.appxmanifest version
        uses: hoobio/pipeline-tools/pipeline/github/step/stamp-msix-version@v2.3.1
        with:
          manifest-path: ${{ env.APPXMANIFEST_PATH }}
          version: ${{ steps.version.outputs.version }}

      - name: Build MSIX
        id: build-msix
        continue-on-error: true
        uses: hoobio/pipeline-tools/pipeline/github/step/build-msix-dotnet@v2.3.1
        env:
          GitHubRelease: 'true'
        with:
          project-path: ${{ env.PROJECT_PATH }}
          platform: x64
          output-dir: ${{ github.workspace }}\AppPackages

      - name: Build MSIX (retry)
        if: steps.build-msix.outcome == 'failure'
        uses: hoobio/pipeline-tools/pipeline/github/step/build-msix-dotnet@v2.3.1
        env:
          GitHubRelease: 'true'
        with:
          project-path: ${{ env.PROJECT_PATH }}
          platform: x64
          output-dir: ${{ github.workspace }}\AppPackages

      - name: Package msixupload
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STAGE_DIR: ${{ github.workspace }}\staging\msix-x64
        run: |
          $msix = Get-ChildItem -Path "${{ github.workspace }}\AppPackages" -Recurse -Filter *.msix -ErrorAction Stop | Select-Object -First 1
          if (-not $msix) { throw "No MSIX produced by dotnet publish" }
          New-Item -ItemType Directory -Path $env:STAGE_DIR -Force | Out-Null
          $zip = Join-Path $env:STAGE_DIR "Steward-$env:VERSION-x64.zip"
          Compress-Archive -Path $msix.FullName -DestinationPath $zip -Force
          $upload = Join-Path $env:STAGE_DIR "Steward-$env:VERSION-x64.msixupload"
          Move-Item -Path $zip -Destination $upload -Force
          Write-Host "Produced $upload"

      - name: Upload msixupload artifact
        uses: actions/upload-artifact@v7
        with:
          name: msixupload-x64
          path: ${{ github.workspace }}\staging\msix-x64\Steward-${{ steps.version.outputs.version }}-x64.msixupload
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [release-please, lint-and-test, build-msi]
    if: >-
      always()
      && needs.release-please.outputs.release_created == 'true'
      && needs.lint-and-test.result == 'success'
      && needs.build-msi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download MSI
        uses: actions/download-artifact@v8
        with:
          name: msi-x64
          path: release

      - name: Attach MSI to the draft release
        uses: hoobio/pipeline-tools/pipeline/github/step/upload-to-github-release@v2.3.1
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          file-path: release/Steward-${{ needs.build-msi.outputs.version }}-x64.msi
          github-token: ${{ github.token }}

      - name: Stack release notes back to the last minor
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.build-msi.outputs.version }}
        run: |
          $notes = [System.Collections.Generic.List[string]]::new()
          $started = $false
          $stop = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[?(\d+)\.(\d+)\.(\d+)') {
              $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
              if (-not $started) { $started = $version -eq $env:VERSION }
              elseif ($stop) { break }
              if ($started -and $Matches[3] -eq '0') { $stop = $true }
            }
            if ($started) { $notes.Add($line) }
          }
          if ($notes.Count -eq 0) { throw "No CHANGELOG.md section for $env:VERSION" }
          Set-Content -Path notes.md -Value $notes
          gh release edit $env:TAG --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed (exit $LASTEXITCODE)" }

      - name: Publish the release
        uses: hoobio/pipeline-tools/pipeline/github/step/publish-github-release@v2.3.1
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          github-token: ${{ github.token }}

  store-submit:
    name: Publish to Microsoft Store
    needs: [release-please, build-msix, release]
    if: >-
      always()
      && needs.release-please.outputs.release_created == 'true'
      && needs.build-msix.result == 'success'
      && needs.release.result == 'success'
      && vars.AZURE_CLIENT_ID != ''
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      STORE_PRODUCT_ID: 9PBKMZFKZHKX
      KEY_VAULT: hbicfgkvtaus01
    steps:
      - uses: actions/checkout@v7

      - name: Download msixupload
        uses: actions/download-artifact@v8
        with:
          name: msixupload-x64
          path: package

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Store credentials from Key Vault
        shell: pwsh
        run: |
          $store = @{}
          foreach ($name in 'tenant-id', 'client-id', 'client-secret', 'seller-id') {
            $value = az keyvault secret show --vault-name $env:KEY_VAULT --name "msstore-$name" --query value -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $value) { throw "Key Vault secret msstore-$name could not be read" }
            Write-Host "::add-mask::$value"
            $store[$name] = $value
          }
          msstore reconfigure --tenantId $store['tenant-id'] --sellerId $store['seller-id'] --clientId $store['client-id'] --clientSecret $store['client-secret']
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }

      - name: Publish package + release notes to Store
        shell: pwsh
        env:
          PRODUCT_ID: ${{ env.STORE_PRODUCT_ID }}
          VERSION: ${{ needs.build-msix.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\scripts\Get-StoreWhatsNew.ps1"
          $package = (Get-ChildItem package -Filter *.msixupload | Select-Object -First 1).FullName
          if (-not $package) { throw 'No .msixupload artifact found' }

          msstore submission delete $env:PRODUCT_ID --no-confirm 2>$null
          $global:LASTEXITCODE = 0

          msstore publish $package -id $env:PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }

          $whatsNew = Get-StoreWhatsNew -ChangelogPath "$env:GITHUB_WORKSPACE\CHANGELOG.md" -Version $env:VERSION

          $out = msstore submission get $env:PRODUCT_ID | Out-String
          if ($LASTEXITCODE -ne 0) { throw "submission get failed ($LASTEXITCODE)" }
          $s = $out.IndexOf('{'); $e = $out.LastIndexOf('}')
          if ($s -lt 0 -or $e -le $s) { throw 'Could not parse submission JSON from msstore output' }
          $sub = $out.Substring($s, $e - $s + 1) | ConvertFrom-Json

          foreach ($listing in $sub.Listings.PSObject.Properties) {
            $listing.Value.BaseListing | Add-Member -NotePropertyName ReleaseNotes -NotePropertyValue $whatsNew -Force
          }

          $sub | ConvertTo-Json -Depth 100 | Set-Content -Path patched.json -Encoding utf8
          msstore submission updateMetadata $env:PRODUCT_ID (Get-Content -Raw patched.json)
          if ($LASTEXITCODE -ne 0) { throw "updateMetadata failed ($LASTEXITCODE)" }

          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "submission publish failed ($LASTEXITCODE)" }
          Write-Host "Submitted $package to the Store (product $env:PRODUCT_ID)."

  pre-release:
    name: Publish Pre-release
    needs: [release-please, lint-and-test, build-msi]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.release-please.outputs.release_created != 'true'
      && needs.lint-and-test.result == 'success'
      && needs.build-msi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download MSI
        uses: actions/download-artifact@v8
        with:
          name: msi-x64
          path: release

      - name: Create the pre-release and keep the latest five
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-msi.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "$tag" --generate-notes ${previous:+--notes-start-tag "$previous"} "release/Steward-$VERSION-x64.msi"
          gh release list --limit 100 --json tagName,isPrerelease,createdAt --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes

  dispatch:
    name: Notify addons
    needs: [release, pre-release]
    # Ordering only: whichever of the two published, the manifests the app polls are rebuilt from the release list.
    if: always() && (needs.release.result == 'success' || needs.pre-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Requires the release-please GitHub App to also be installed on hoobio/addons.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: hoobio
          repositories: addons

      - name: Dispatch addon-released
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/hoobio/addons/dispatches -f event_type=addon-released
