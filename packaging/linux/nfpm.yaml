name: steward
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: games
priority: optional
maintainer: Hoobi <7289249+hoobio@users.noreply.github.com>
description: Desktop companion for Steward, a guild toolkit for World of Warcraft. It keeps the Steward addons current.
vendor: Hoobi
homepage: https://github.com/hoobio/steward-companion
license: Proprietary

contents:
  - src: ./publish/
    dst: /opt/steward
    type: tree
  - src: /opt/steward/Steward.Desktop
    dst: /usr/bin/steward
    type: symlink
  - src: ./packaging/linux/steward.desktop
    dst: /usr/share/applications/steward.desktop
  - src: ./src/Steward.Desktop/Assets/Square44x44Logo.targetsize-16_altform-unplated.png
    dst: /usr/share/icons/hicolor/16x16/apps/steward.png
  - src: ./src/Steward.Desktop/Assets/Square44x44Logo.targetsize-24_altform-unplated.png
    dst: /usr/share/icons/hicolor/24x24/apps/steward.png
  - src: ./src/Steward.Desktop/Assets/Square44x44Logo.targetsize-32_altform-unplated.png
    dst: /usr/share/icons/hicolor/32x32/apps/steward.png
  - src: ./src/Steward.Desktop/Assets/Square44x44Logo.targetsize-48_altform-unplated.png
    dst: /usr/share/icons/hicolor/48x48/apps/steward.png
  - src: ./src/Steward.Desktop/Assets/Steward-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/steward.png
  - src: ./src/Steward.Desktop/Assets/Fonts/*.txt
    dst: /usr/share/doc/steward/

scripts:
  postinstall: ./packaging/linux/postinstall.sh
  postremove: ./packaging/linux/postinstall.sh

overrides:
  deb:
    depends:
      - ca-certificates
      - libc6
      - libgcc-s1
      - libgssapi-krb5-2
      - libicu78 | libicu76 | libicu74 | libicu72 | libicu70
      - libssl3t64 | libssl3
      - libstdc++6
      - tzdata
      - libfontconfig1
      - libx11-6
      - libice6
      - libsm6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxrandr2
    recommends:
      - libgtk-3-0t64 | libgtk-3-0
      - libgl1
      - xdg-utils
  rpm:
    depends:
      - ca-certificates
      - glibc
      - krb5-libs
      - libgcc
      - libicu
      - libstdc++
      - openssl-libs
      - tzdata
      - fontconfig
      - libX11
      - libICE
      - libSM
      - libXcursor
      - libXext
      - libXfixes
      - libXi
      - libXrandr
    recommends:
      - gtk3
      - mesa-libGL
      - xdg-utils

rpm:
  signature:
    key_file: ${NFPM_RPM_KEY_FILE}
    key_id: E6ED105810B41C42
